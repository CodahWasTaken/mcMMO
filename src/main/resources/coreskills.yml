#
# This file includes a few settings for each skill in mcMMO

#Acrobatics
Acrobatics:
    # turn this to false to disable all subskills for this skill
    Enabled: true
    Roll:
        Enabled: true

#Spears
Spears:
    # turn this to false to disable the Spears skill entirely
    Enabled: true

#Maces
Maces:
    # turn this to false to disable the Maces skill entirely
    Enabled: true

#Unarmed
Unarmed:
    # turn this to false to disable the Unarmed skill entirely
    Enabled: true